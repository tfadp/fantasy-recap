<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px/1.45 -apple-system, system-ui, sans-serif; width: 300px;
         margin: 0; padding: 14px; color: #16181d; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  button { width: 100%; padding: 9px; margin-bottom: 6px; border-radius: 7px;
           border: 1px solid #c8ccd4; background: #fff; font-size: 13px;
           cursor: pointer; }
  button.primary { background: #1c4ed8; border-color: #1c4ed8; color: #fff;
                   font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  #status { margin-top: 10px; padding: 8px; border-radius: 6px; font-size: 12px;
            white-space: pre-wrap; display: none; }
  .ok   { background: #e8f5ec; color: #14562c; display: block !important; }
  .warn { background: #fdf4e3; color: #6b4c10; display: block !important; }
  .err  { background: #fdeceb; color: #7d1f1a; display: block !important; }
  a { font-size: 12px; color: #1c4ed8; }
</style>

<h1>Send week to writer</h1>
<button id="send" class="primary">Read this page and send</button>
<button id="copy">Copy JSON to clipboard</button>
<button id="download">Download JSON</button>
<div id="status"></div>
<a href="#" id="opts">Settings</a>
<script src="popup.js"></script>
