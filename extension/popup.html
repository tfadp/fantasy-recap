<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; padding: 14px;
         font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         color: #17181a; background: #fff; }
  h1 { font-size: 14px; margin: 0 0 2px; }
  p.sub { margin: 0 0 12px; color: #6b7076; font-size: 12px; }
  button { width: 100%; padding: 10px; font-size: 13px; font-weight: 600;
           border: 0; border-radius: 7px; background: #135b45; color: #fff;
           cursor: pointer; }
  button:disabled { background: #9aa3a8; cursor: default; }
  button.secondary { margin-top: 7px; background: #fff; color: #5b6270;
                     border: 1px solid #d4d8db; font-weight: 500; }
  button.secondary:disabled { color: #b0b6bb; background: #fff; }
  #status { margin-top: 11px; font-size: 12px; white-space: pre-wrap;
            line-height: 1.5; }
  .ok { color: #135b45; } .err { color: #a3261d; } .warn { color: #7a5b12; }
  details { margin-top: 11px; }
  summary { font-size: 12px; color: #6b7076; cursor: pointer; }
  label { display: block; margin-top: 8px; font-size: 12px; color: #6b7076; }
  input { width: 100%; padding: 6px; margin-top: 3px; font-size: 12px;
          border: 1px solid #d4d8db; border-radius: 5px; box-sizing: border-box; }
  a { color: #135b45; font-size: 12px; }
</style>
<h1>Send week to writer</h1>
<p class="sub">Open your league page and press the button. It works out which
week is finished on its own.</p>
<button id="go">Read the week and send it</button>
<button id="test" class="secondary">Test only - read it, don't send</button>
<div id="status"></div>
<details>
  <summary>Options</summary>
  <label>Week (blank = the finished one)
    <input id="week" type="number" min="1" max="18" placeholder="auto">
  </label>
  <p style="margin-top:10px"><a href="#" id="opts">Repository and token…</a></p>
</details>
<script src="popup.js"></script>
