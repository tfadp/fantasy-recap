name: Weekly fantasy recap

on:
  schedule:
    # Tuesday 06:00 UTC: 2am Eastern until the clocks change, 1am after. Monday
    # night is final by then, and GitHub cron routinely runs hours late, so in
    # practice the recap lands early Tuesday morning.
    #
    # 13:00 UTC is the fallback. If the early run found a late Monday game not
    # yet final, or GitHub dropped it, this one writes the week. If the early
    # run already wrote it, --skip-written makes this one a no-op, so there is
    # never a second, different recap in your inbox.
    #
    # The same flag covers a manual run with no note: it re-sends the week
    # already written instead of rewriting it. Add a note to force a rewrite.
    #
    # No hour guard. A guard once skipped a real Tuesday (1 September) because
    # the run was four hours late, and reported success.
    - cron: "0 6 * * 2"
    - cron: "0 13 * * 2"
  # the browser extension fires this when you click "Send week to writer"
  repository_dispatch:
    types: [yahoo-week]
  workflow_dispatch:
    inputs:
      week:
        description: "Week number (blank = current)"
        required: false
      note:
        description: "Steer the rewrite, e.g. 'lead with the Kittle zero'"
        required: false
      force:
        description: "Write even if a game is not final"
        required: false
        default: "false"

# the run commits history, out/ and docs/ back to the repo
permissions:
  contents: write

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      # The voice files are gitignored, because a public repo is the price of
      # free Pages and the league's group chat should not be on it. They are
      # restored here from secrets for the length of the run.
      - name: Restore the voice files
        env:
          MOP_CHAT: ${{ secrets.MOP_CHAT }}
          MOP_LORE: ${{ secrets.MOP_LORE }}
        # Actions runs steps under `bash -e`, so a bare `[ -n "$X" ] && cmd`
        # exits 1 when the secret is unset and fails the whole job. Use if.
        run: |
          if [ -n "$MOP_CHAT" ]; then
            printf '%s' "$MOP_CHAT" > prompts/mop-chat.md
            echo "restored mop-chat.md"
          else
            echo "MOP_CHAT not set; the recap will be written without the group chat"
          fi
          if [ -n "$MOP_LORE" ]; then
            printf '%s' "$MOP_LORE" > prompts/mop-lore.md
            echo "restored mop-lore.md"
          else
            echo "MOP_LORE not set; the recap will be written without the lore"
          fi

      - name: Restore Yahoo token
        env:
          YAHOO_OAUTH_JSON: ${{ secrets.YAHOO_OAUTH_JSON }}
        run: |
          if [ -n "$YAHOO_OAUTH_JSON" ]; then
            echo "$YAHOO_OAUTH_JSON" > oauth2.json
          fi

      - name: Stash the handed-in week
        if: github.event_name == 'repository_dispatch'
        env:
          LW: ${{ toJSON(github.event.client_payload.league_week) }}
        run: |
          mkdir -p inbox
          printf '%s' "$LW" > inbox/handed-in.json
          python3 -c "import json;d=json.load(open('inbox/handed-in.json'));print('got',d.get('source'),'week',d.get('week'))"

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEAGUE_TZ: America/New_York
        run: |
          python3 run.py \
            ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }} \
            ${{ github.event.inputs.note && format('--note {0}', toJSON(github.event.inputs.note)) || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }} \
            ${{ !github.event.inputs.note && '--skip-written' || '' }}

      # Publishes the week to an unguessable draft URL. It does not touch
      # index.html or the archive until you approve it.
      - name: Build the web page
        env:
          DRAFT_SALT: ${{ secrets.DRAFT_SALT }}
        run: python3 publish.py

      - name: Send it
        env:
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          RECAP_EMAIL_TO: ${{ secrets.RECAP_EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          DRAFT_SALT: ${{ secrets.DRAFT_SALT }}
        run: python3 deliver.py

      # Keeps history and past write-ups so next week's recap knows the lore.
      # The voice files are gitignored, so nothing private is committed here.
      - name: Commit results
        run: |
          git config user.name "fantasy-recap"
          git config user.email "actions@github.com"
          git add out history docs approved.json delivered.json
          git diff --staged --quiet || git commit -m "Week recap $(date +%F)"
          git push

      - name: Save the facts even if the run failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recap-output
          path: out/
          if-no-files-found: ignore
